<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxa · Logs · {{.Project}}/{{.Service}}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/alpine.min.js" defer></script>
<style>
  .logs-page { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .logs-toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 12px;
  }
  .logs-toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); }
  .logs-toolbar select, .logs-toolbar input[type=checkbox] {
    font: inherit;
  }
  .logs-toolbar .spacer { flex: 1; }
  .logs-toolbar .status {
    font-size: 11.5px; color: var(--fg-3);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .logs-output {
    background: #0d1117; color: #e6edf3;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; line-height: 1.45;
    padding: 12px 16px; border-radius: 8px;
    height: calc(100vh - 220px); min-height: 320px;
    overflow-y: auto; white-space: pre; tab-size: 4;
    border: 1px solid var(--border-strong);
  }
  .logs-output .empty { color: #8b949e; font-style: italic; }
</style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="/ui/">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="2" width="20" height="20" rx="6" fill="#2a9d8f" opacity=".15"/>
      <path d="M7 8h4a3 3 0 0 1 0 6H7V8z" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 8v8" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
      <circle cx="17" cy="8" r="1.5" fill="#2a9d8f"/>
    </svg>
    <span class="wordmark">Proxa</span>
  </a>
  <div class="cluster-status">
    <a href="/ui/" style="color:var(--fg-3);text-decoration:none">← Back to dashboard</a>
  </div>
</nav>

<div class="logs-page" x-data="logsController()">
  <div class="page-header">
    <div>
      <h1 class="page-title" style="font-size:20px">
        📜 <span class="chip chip-brand">{{.Project}}</span>
        <span class="svc-name">{{.Service}}</span>
        <span style="font-size:13px;color:var(--fg-3);font-weight:400">— logs</span>
      </h1>
    </div>
  </div>

  <div class="logs-toolbar">
    <label>
      Replica
      <select x-model.number="replica" @change="reconnect()">
        {{range .Replicas}}<option value="{{.}}">{{.}}</option>{{end}}
      </select>
    </label>
    <label>
      <input type="checkbox" x-model="follow" @change="reconnect()">
      Follow
    </label>
    <label>
      Tail
      <select x-model.number="tail" @change="reconnect()">
        <option value="50">50</option>
        <option value="200" selected>200</option>
        <option value="1000">1000</option>
        <option value="-1">all</option>
      </select>
    </label>
    <div class="spacer"></div>
    <span class="status" x-text="statusText"></span>
  </div>

  <div class="logs-output" x-ref="output" @scroll="onScroll()">
    <span class="empty" x-show="lines.length === 0">Waiting for log lines…</span>
  </div>
</div>

<script>
function logsController() {
  return {
    project: {{.Project | printf "%q"}},
    service: {{.Service | printf "%q"}},
    replica: 0,
    follow: true,
    tail: 200,
    lines: [],
    autoscroll: true,
    statusText: "connecting…",
    _es: null,

    init() {
      this.$nextTick(() => this.reconnect());
      window.addEventListener("beforeunload", () => this.close());
    },

    close() {
      if (this._es) { this._es.close(); this._es = null; }
    },

    reconnect() {
      this.close();
      this.lines = [];
      this.$refs.output.textContent = "";

      const q = new URLSearchParams();
      if (this.follow) q.set("follow", "true");
      if (this.tail !== -1) q.set("tail", String(this.tail));
      if (this.replica !== 0) q.set("replica", String(this.replica));

      const url = `/api/v1/projects/${this.project}/services/${this.service}/logs?${q.toString()}`;
      this.statusText = "connecting…";
      this._es = new EventSource(url, { withCredentials: true });

      this._es.addEventListener("meta", (e) => {
        try {
          const m = JSON.parse(e.data);
          this.statusText = `streaming ${m.container} (replica ${m.replica})`;
        } catch { this.statusText = "streaming"; }
      });

      this._es.onmessage = (e) => {
        this.lines.push(e.data);
        const out = this.$refs.output;
        const span = document.createElement("span");
        span.textContent = e.data + "\n";
        out.appendChild(span);
        if (this.autoscroll) out.scrollTop = out.scrollHeight;
      };

      this._es.addEventListener("end", (e) => {
        this.statusText = "stream ended";
        this.close();
      });

      this._es.addEventListener("error", (e) => {
        if (this._es && this._es.readyState === EventSource.CLOSED) {
          this.statusText = "disconnected";
        } else {
          this.statusText = "reconnecting…";
        }
      });
    },

    onScroll() {
      const out = this.$refs.output;
      const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
      this.autoscroll = atBottom;
    },
  };
}
</script>
</body>
</html>
